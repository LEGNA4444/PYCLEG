<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Laberinto</title>
    <link rel="stylesheet" href="../../SORCS/estilos.css">
</head>

<body class="game-page">
    <header>
        <!-- El botón de modo oscuro es vital para que el script global no haga un return prematuro -->
        <button id="toggle-dark" style="display:none;">Modo Oscuro</button>
    </header>

    <main role="main">
        <h1 class="game-title">Juego del Laberinto Matemático</h1>
        
        <div id="game-info">
            <p>Nivel: <span id="level">1</span></p>
        </div>

        <div id="game-grid"></div>

        <p>Pasos restantes: <span id="moves-left">5</span></p>

        <button id="reset-button">Reiniciar juego</button>

        <audio id="background-music" loop>
            <source src="https://LEGNA4444.github.io/PYCLEG/rg/GAME/RP_LP_3.mp3" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </main>

    <script src="../../SORCS/script-global.js"></script>
</body>

</html>
